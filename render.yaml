services:
  - type: web
    name: ecom-cs-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TOOL_BACKEND
        value: mock
      - key: PYTHONUNBUFFERED
        value: "1"
      # 真实模型模式：PROVIDER 写默认值，API_KEY 在 Render 控制台填写（sync:false，不落仓库）
      - key: PROVIDER
        value: zhipu
      - key: API_KEY
        sync: false
      # PORT 由 Render 自动注入，应用读取环境变量，不要在这里写死
